# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json

# Configuration generated by YASB Setup Wizard.
# For more information, visit https://github.com/amnweb/yasb/wiki
watch_stylesheet: true
watch_config: true
debug: false
update_check: true
bars:
  primary-bar:
    enabled: true
    screens:
    - '*'
    class_name: yasb-bar
    alignment:
      position: top
      align: center
    animation:
      enabled: true
      duration: 300
    blur_effect:
      enabled: false
      round_corners: true
      round_corners_type: normal
      border_color: system
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: 100%
      height: 34
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
      - quick_launch
      - home
      - komorebi_stack
      center:
      - komorebi_control
      - komorebi_workspaces
      - komorebi_active_layout
      - whkd_keybinds
      right:
      - media
      - systray
      - cpu_group
      - gpu_group
      - memory
      - volume
      - bluetooth
      - notifications
      - power_menu
      - clock
widgets:
  home:
    type: yasb.home.HomeWidget
    options:
      label: "<span>\uE8A9</span>"
      menu_list:
      - title: User Home
        path: '~'
      - title: Download
        path: ~\Downloads
      - title: Documents
        path: ~\Documents
      - title: Pictures
        path: ~\Pictures
      system_menu: true
      power_menu: true
      blur: true
      round_corners: true
      round_corners_type: normal
      border_color: System
      alignment: left
      offset_left: -12
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: '{%H:%M}<span>{alarm}</span>'
      label_alt: '{%a, %d %b %H:%M}'
      timezones: []
      calendar:
        blur: true
        round_corners: true
        alignment: center
        direction: down
        extended: false
        show_years: true
        show_holidays: false
        show_week_numbers: true
      callbacks:
        on_left: toggle_calendar
        on_middle: toggle_label
        on_right: context_menu
  volume:
    type: yasb.volume.VolumeWidget
    options:
      label: <span>{icon}</span>
      label_alt: <span>{icon}</span>{level}
      tooltip: true
      icons:
        muted: "\uE74F"
        '10': "\uE992"
        '30': "\uE993"
        '60': "\uE994"
        '100': "\uE995"
      callbacks:
        on_left: toggle_volume_menu
        on_right: toggle_mute
      audio_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: right
        direction: down
        show_apps: true
        show_app_labels: false
        show_app_icons: true
        show_apps_expanded: false
        app_icons:
          toggle_down: "\uE972"
          toggle_up: "\uE971"
  notifications:
    type: yasb.notifications.NotificationsWidget
    options:
      label: "<span>\uF2A5</span>"
      label_alt: '{count} notifications'
      hide_empty: true
      tooltip: false
      callbacks:
        on_left: toggle_notification
        on_right: do_nothing
        on_middle: do_nothing
  power_menu:
    type: yasb.power_menu.PowerMenuWidget
    options:
      label: "<span>\uE712</span>"
      uptime: true
      show_user: true
      menu_style: popup
      popup:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: right
        offset_left: 12
      profile_image_size: 64
      buttons:
        lock:
        - "\uDB80\uDF41"
        - Lock
        signout:
        - "\uDB80\uDF43"
        - Sign out
        sleep:
        - "\uDB82\uDD04"
        - Sleep
        hibernate:
        - "\uDB82\uDD01"
        - Hibernate
        restart:
        - "\uDB81\uDC53"
        - Restart
        shutdown:
        - "\uDB82\uDD06"
        - Shut Down
        cancel:
        - ''
        - Cancel
  komorebi_workspaces:
    type: komorebi.workspaces.WorkspaceWidget
    options:
      # Field set verified against this build's Pydantic models (2026-09-28).
      # Offline => widget hides, so no stray text can ever show on the bar.
      hide_if_offline: true
      label_zero_index: false
      # Show ALL 9 workspaces on every monitor, always in order 1..9.
      # With hide_empty_workspaces: true an empty workspace 1 vanishes from the
      # bar and the list visually "starts at 2" on the main monitor.
      hide_empty_workspaces: true
      enable_scroll_switching: true
      label_default_name: '{index}'
      label_workspace_btn: '{name}'
      label_workspace_active_btn: '{name}-ac ✅'
      label_workspace_populated_btn: '{name}'
      label_offline: '—'
      label_float_override: 'float'
  komorebi_active_layout:
    type: komorebi.active_layout.ActiveLayoutWidget
    options:
      # label substitutes ONLY {icon} and {layout_name} ('{layout}' never worked).
      # layouts MUST be snake_case: the widget kebab-cases them for komorebic and
      # CamelCase entries make the connect handler rotate the deque forever.
      hide_if_offline: true
      label: '{icon} {layout_name}'
      layouts:
        - bsp
        - columns
        - rows
        - grid
        - scrolling
        - vertical_stack
        - horizontal_stack
        - ultrawide_vertical_stack
        - right_main_vertical_stack
        - monocle
        - maximized
        - floating
        - paused
        - tiling
      layout_menu:
        alignment: left
        round_corners_type: normal
  komorebi_stack:
    type: komorebi.stack.StackWidget
    options:
      # show_icons is an enum: focused | always | never
      show_icons: always
      hide_if_offline: true
      label_offline: '—'
      label_zero_index: false
      max_length_active: 99
      enable_scroll_switching: true
      label_window: '{title}'
      label_window_active: '{title}'
      label_no_window: '—'
  komorebi_control:
    type: komorebi.control.KomorebiControlWidget
    options:
      # No hide_if_offline. `label` is rendered RAW: this widget substitutes
      # nothing, so "{icon}" was showing as literal text. Static glyph below.
      # U+E7C4 = TaskView (window overview), present in Segoe MDL2 / SegoeIcons.
      label: "<span>\uE7C4</span>"
      run_whkd: true
      show_version: true
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: do_nothing
      icons:
        start: "<span>\uE768</span>"
        stop: "<span>\uE769</span>"
        reload: "<span>\uE72C</span>"
      komorebi_menu:
        alignment: center
        round_corners_type: normal
  whkd_keybinds:
    type: yasb.whkd.WhkdWidget
    options:
      # No hide_if_offline. `label` is rendered RAW: {count} is NOT supported
      # and was printing literally. U+EDA7 = KeyboardShortcut (U+E727 was the
      # InPrivate glyph, i.e. the wrong icon).
      label: "<span>\uEDA7</span>"
  bluetooth:
    type: yasb.bluetooth.BluetoothWidget
    options:
      # this widget has no hide_if_offline field
      label: "<span>\uE702</span>"
      label_alt: "<span>\uE716</span>"
      label_no_device: "no devices"
      label_device_separator: ","
      icons:
        bluetooth_on: "<span>\uE702</span>"
        bluetooth_off: "<span>\uE703</span>"
        bluetooth_connected: "<span>\uE716</span>"
      menu_config:
        alignment: center
        round_corners_type: normal
  glazewm_workspaces:
    type: glazewm.workspaces.GlazewmWorkspacesWidget
    options:
      enabled: false
      hide_if_offline: true
      monitor_exclusive: false
  cpu:
    type: yasb.cpu.CpuWidget
    options:
      label: "<font face='Segoe Fluent Icons'>\uEEA1</font> {info[percent][total]}%"
      label_alt: '{info[freq][current]} MHz'
      update_interval: 2000
      hide_decimal: true
      cpu_thresholds:
        low: 50
        medium: 75
        high: 99
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
        alignment: center
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: toggle_label
  cpu_group:
    type: yasb.grouper.GrouperWidget
    options:
      class_name: cpu-group
      widgets:
      - cpu
      - cpu_temp
      hide_empty: false
      collapse_options:
        enabled: false
  gpu_group:
    type: yasb.grouper.GrouperWidget
    options:
      class_name: gpu-group
      widgets:
      - gpu
      - gpu_temp
      hide_empty: false
      collapse_options:
        enabled: false
  gpu:
    type: yasb.gpu.GpuWidget
    options:
      gpu_index: 0
      label: "<font face='Segoe Fluent Icons'>\uE945</font> {info[utilization]}%"
      label_alt: "<font face='Segoe Fluent Icons'>\uE945</font> {info[mem_used]} / {info[mem_total]}"
      update_interval: 2000
      hide_decimal: true
      gpu_thresholds:
        low: 50
        medium: 75
        high: 99
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
        alignment: right
        direction: down
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: toggle_label

  gpu_temp:
    type: yasb.custom.CustomWidget
    options:
      class_name: gpu-temp-widget
      label: "{data}"
      label_alt: "{data}"
      label_placeholder: "--\u00B0C"
      exec_options:
        run_cmd: "powershell -NoProfile -ExecutionPolicy Bypass -File C:\\Users\\DavoodYa\\Tools\\sensor-color.ps1 -SensorId /gpu-nvidia/0/temperature/0 -Type gpu"
        run_interval: 3000
        return_format: string
        hide_empty: true
      callbacks:
        on_left: do_nothing
        on_middle: do_nothing
        on_right: do_nothing
  cpu_temp:
    type: yasb.custom.CustomWidget
    options:
      class_name: cpu-temp-widget
      label: "{data}"
      label_alt: "{data}"
      label_placeholder: "--\u00B0C"
      exec_options:
        run_cmd: "powershell -NoProfile -ExecutionPolicy Bypass -File C:\\Users\\DavoodYa\\Tools\\sensor-color.ps1 -SensorId /intelcpu/0/temperature/0 -Type cpu"
        run_interval: 3000
        return_format: string
        hide_empty: true
      callbacks:
        on_left: do_nothing
        on_middle: do_nothing
        on_right: do_nothing
  memory:
    type: yasb.memory.MemoryWidget
    options:
      label: "<font face='Segoe Fluent Icons'>\uE9D9</font> {virtual_mem_free}"
      label_alt: "<font face='Segoe Fluent Icons'>\uEFC5</font> VIRT: {virtual_mem_percent}% SWAP: {swap_mem_percent}%"
      update_interval: 5000
      hide_decimal: true
      memory_thresholds:
        low: 50
        medium: 75
        high: 99
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: toggle_label
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
        alignment: center
  quick_launch:
    type: yasb.quick_launch.QuickLaunchWidget
    options:
      label: "<span>\uE71E</span>"
      search_placeholder: Search applications...
      max_results: 30
      show_icons: true
      icon_size: 16
      compact_text: true
      providers:
        apps:
          enabled: true
          prefix: '*'
          priority: 0
          show_recent: true
          max_recent: 5
          show_description: true
      popup:
        width: 720
        height: 480
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        dark_mode: true
      callbacks:
        on_left: toggle_quick_launch
      keybindings:
      - keys: alt+space
        action: toggle_quick_launch
        screen: primary
  active_window:
    type: yasb.active_window.ActiveWindowWidget
    options:
      label: '{win[title]}'
      label_alt: '[class_name=''{win[class_name]}'' exe=''{win[process][name]}'' hwnd={win[hwnd]}]'
      label_no_window: ''
      label_icon: true
      label_icon_size: 16
      max_length: 32
      max_length_ellipsis: '...'
      monitor_exclusive: false
  systray:
    type: yasb.systray.SystrayWidget
    options:
      class_name: systray
      label_collapsed: "\uE972"
      label_expanded: "\uE971"
      label_position: right
      pin_click_modifier: ctrl
      show_unpinned: false
      show_battery: false
      show_volume: false
      icon_size: 16
      use_hook: true
      show_in_popup: true
      icons_per_row: 5
      popup:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: None
        alignment: center
        direction: down
        offset_top: 6
        offset_left: 0
  media:
    type: yasb.media.MediaWidget
    options:
      label: '{title}{s}{artist}'
      label_alt: '{title}'
      separator: ' - '
      hide_empty: true
      callbacks:
        on_left: toggle_media_menu
        on_middle: do_nothing
        on_right: do_nothing
      max_field_size:
        label: 20
        label_alt: 20
      show_thumbnail: true
      controls_only: false
      controls_left: true
      controls_hide: true
      thumbnail_alpha: 100
      thumbnail_padding: 10
      thumbnail_edge_fade: true
      icons:
        prev_track: "\uE892"
        next_track: "\uE893"
        play: "\uE768"
        pause: "\uE769"
      media_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: center
        direction: down
        thumbnail_corner_radius: 8
        thumbnail_size: 120
        max_title_size: 60
        max_artist_size: 20
        show_volume_slider: true
      scrolling_label:
        enabled: true
        style: bounce
        update_interval_ms: 40


# liveness-ping 17:45:30
