[package]
name = "komorebi-dashboard"
version = "0.1.0"
edition = "2021"

[lib]
name = "dashboard_core"

[[bin]]
name = "KomorebiDashboard"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros", "signal"] }
tauri = { version = "=2.12.1", optional = true , features = [] }

[build-dependencies]
tauri-build = { version = "=2.7.1", optional = true , features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
